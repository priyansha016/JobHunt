[project]
name = "jobhunt"
version = "0.1.0"
description = "LinkedIn JobHunt Profiler, Connection Booster & Network Cleanup with Laya and DuckDB"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "duckdb>=1.1.0",
    "fastapi>=0.115.0",
    "httpx>=0.27.0",
    "laya>=0.4.0",
    "pydantic>=2.8.0",
    "pypdf>=5.0.0",
    "pytest>=8.0.0",
    "python-multipart>=0.0.12",
    "requests>=2.31.0",
    "uvicorn>=0.30.0",
]

[tool.uv]
package = false
